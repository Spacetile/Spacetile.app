name: Bug report
description: Something in Spacetile doesn't work as the docs describe.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: version
    attributes:
      label: Spacetile version
      description: Shown in About Spacetile.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Displays, Spaces and any relevant settings or profile.
